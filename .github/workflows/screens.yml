name: README screenshots

# Screenshots of the app for the README, taken on the emulator from a build of this branch. Runs when the script
# changes (or by hand); the pictures are in the job log and the "screens" artifact.
on:
  push:
    branches: [ "ccr-*" ]
    paths: [ ".github/screens.sh", ".github/workflows/screens.yml" ]
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply submodule patches
        run: git -C MediaServiceCore apply --ignore-whitespace --whitespace=nowarn ../.github/patches/mediaservicecore.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleStphoneRelease
          cp smarttubetv/build/outputs/apk/stphone/release/*_universal.apk app.apk

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: false
          script: bash .github/screens.sh

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/
