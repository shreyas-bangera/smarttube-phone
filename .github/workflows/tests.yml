name: Unit tests

# The JVM unit tests (Robolectric) of :common, which the APK builds don't run. See issue #91.
on:
  push:
    branches: [ "ccr-*" ]
    paths-ignore: [ "README.md", "images/**", ".github/*.sh", ".github/whats-new.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "README.md", "images/**" ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply submodule patches
        run: git -C MediaServiceCore apply --ignore-whitespace --whitespace=nowarn ../.github/patches/mediaservicecore.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :common:testStstableDebugUnitTest

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: common/build/reports/tests/
          retention-days: 7
